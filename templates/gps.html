<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GUZO PLUS - Live GPS</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .header {
            height: 72px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            position: relative;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 23px;
            font-weight: bold;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: #1769ff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .online {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #19c37d;
            box-shadow: 0 0 10px rgba(25,195,125,0.7);
        }

        .layout {
            display: flex;
            height: calc(100vh - 72px);
        }

        .sidebar {
            width: 310px;
            background: white;
            padding: 22px;
            overflow-y: auto;
            box-shadow: 2px 0 12px rgba(0,0,0,0.07);
            z-index: 500;
        }

        .sidebar h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .subtitle {
            color: #687386;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat {
            background: #f6f8fc;
            border-radius: 12px;
            padding: 13px;
        }

        .stat-number {
            font-size: 22px;
            font-weight: bold;
        }

        .stat-label {
            color: #6b7280;
            font-size: 12px;
            margin-top: 3px;
        }

        .filters {
            margin-top: 15px;
        }

        .filter {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 10px;
            background: #f7f8fa;
            cursor: pointer;
            transition: 0.2s;
        }

        .filter:hover {
            background: #eaf1ff;
        }

        .filter-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .vehicle-count {
            background: #e9edf5;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .legend-icon {
            font-size: 20px;
        }

        .map-area {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-card {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 400;
            background: white;
            border-radius: 14px;
            padding: 14px 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            min-width: 220px;
        }

        .map-card-title {
            font-size: 12px;
            color: #737b8c;
        }

        .map-card-value {
            font-size: 22px;
            font-weight: bold;
            margin-top: 3px;
        }

        .demo-badge {
            position: absolute;
            bottom: 18px;
            left: 18px;
            z-index: 400;
            background: rgba(255,255,255,0.95);
            padding: 9px 14px;
            border-radius: 10px;
            font-size: 12px;
            color: #596273;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        .vehicle-popup {
            font-family: Arial, sans-serif;
        }

        .vehicle-popup strong {
            font-size: 15px;
        }

        .back-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #1769ff;
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 800px) {
            .sidebar {
                width: 230px;
            }

            .header {
                padding: 0 15px;
            }

            .brand {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="brand">
        <div class="brand-icon">📍</div>
        GUZO PLUS
    </div>

    <div class="status">
        <span class="online"></span>
        LIVE GPS SIMULATION
    </div>
</header>

<div class="layout">

    <aside class="sidebar">

        <h2>Live Vehicles</h2>

        <div class="subtitle">
            Simulated transportation movement
        </div>

        <div class="stats">

            <div class="stat">
                <div class="stat-number" id="totalVehicles">19</div>
                <div class="stat-label">Total Vehicles</div>
            </div>

            <div class="stat">
                <div class="stat-number" id="avgSpeed">0</div>
                <div class="stat-label">Avg Speed km/h</div>
            </div>

        </div>

        <div class="filters">

            <div class="filter" onclick="filterVehicles('all')">
                <div class="filter-left">
                    <span class="legend-icon">🚘</span>
                    <span>All Vehicles</span>
                </div>
                <span class="vehicle-count">19</span>
            </div>

            <div class="filter" onclick="filterVehicles('Bus')">
                <div class="filter-left">
                    <span class="legend-icon">🚌</span>
                    <span>Bus</span>
                </div>
                <span class="vehicle-count">7</span>
            </div>

            <div class="filter" onclick="filterVehicles('Minibus')">
                <div class="filter-left">
                    <span class="legend-icon">🚐</span>
                    <span>Minibus</span>
                </div>
                <span class="vehicle-count">3</span>
            </div>

            <div class="filter" onclick="filterVehicles('Truck')">
                <div class="filter-left">
                    <span class="legend-icon">🚚</span>
                    <span>Truck</span>
                </div>
                <span class="vehicle-count">2</span>
            </div>

            <div class="filter" onclick="filterVehicles('Motorcycle')">
                <div class="filter-left">
                    <span class="legend-icon">🏍️</span>
                    <span>Motorcycle</span>
                </div>
                <span class="vehicle-count">3</span>
            </div>

            <div class="filter" onclick="filterVehicles('Private Car')">
                <div class="filter-left">
                    <span class="legend-icon">🚗</span>
                    <span>Private Car</span>
                </div>
                <span class="vehicle-count">4</span>
            </div>

        </div>

        <a href="/" class="back-btn">
            ← Back to Home
        </a>

    </aside>

    <main class="map-area">

        <div id="map"></div>

        <div class="map-card">
            <div class="map-card-title">GPS STATUS</div>
            <div class="map-card-value">● LIVE</div>
        </div>

        <div class="demo-badge">
            ⚠️ Demo mode — simulated GPS data
        </div>

    </main>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

    // ==========================================
    // MAP
    // ==========================================

    const map = L.map("map").setView([9.030, 38.750], 12);

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);


    // ==========================================
    // VEHICLES
    // ==========================================

    let vehicles = [];
    let markers = {};
    let activeFilter = "all";


    // ==========================================
    // VEHICLE ICON
    // ==========================================

    function createVehicleIcon(vehicle) {

        return L.divIcon({

            className: "",

            html: `
                <div style="
                    font-size:25px;
                    filter: drop-shadow(0 2px 3px rgba(0,0,0,.35));
                    transform: translate(-50%, -50%);
                ">
                    ${vehicle.icon}
                </div>
            `,

            iconSize: [30, 30],
            iconAnchor: [15, 15]
        });
    }


    // ==========================================
    // LOAD VEHICLES
    // ==========================================

    async function loadVehicles() {

        try {

            const response = await fetch("/api/vehicles");

            const data = await response.json();

            vehicles = data.vehicles;

            updateMarkers();

            updateStats();

        } catch (error) {

            console.error("GPS error:", error);

        }

    }


    // ==========================================
    // UPDATE MARKERS
    // ==========================================

    function updateMarkers() {

        const visibleIds = new Set();

        vehicles.forEach(vehicle => {

            if (
                activeFilter !== "all" &&
                vehicle.type !== activeFilter
            ) {
                return;
            }

            visibleIds.add(vehicle.id);

            const position = [
                vehicle.lat,
                vehicle.lng
            ];

            const popup = `
                <div class="vehicle-popup">
                    <strong>${vehicle.icon} ${vehicle.id}</strong>
                    <br><br>
                    <b>Type:</b> ${vehicle.type}
                    <br>
                    <b>Speed:</b> ${vehicle.speed} km/h
                    <br>
                    <b>Route:</b> ${vehicle.route}
                    <br>
                    <b>GPS:</b>
                    ${vehicle.lat.toFixed(5)},
                    ${vehicle.lng.toFixed(5)}
                </div>
            `;

            if (!markers[vehicle.id]) {

                markers[vehicle.id] =
                    L.marker(
                        position,
                        {
                            icon: createVehicleIcon(vehicle)
                        }
                    )
                    .addTo(map);

            } else {

                markers[vehicle.id].setLatLng(position);

            }

            markers[vehicle.id]
                .bindPopup(popup);

        });


        Object.keys(markers).forEach(id => {

            if (!visibleIds.has(id)) {

                map.removeLayer(markers[id]);

            } else {

                if (!map.hasLayer(markers[id])) {
                    markers[id].addTo(map);
                }

            }

        });

    }


    // ==========================================
    // STATISTICS
    // ==========================================

    function updateStats() {

        document.getElementById("totalVehicles")
            .textContent = vehicles.length;

        if (vehicles.length === 0) {
            document.getElementById("avgSpeed").textContent = "0";
            return;
        }

        const totalSpeed = vehicles.reduce(
            (sum, vehicle) => sum + vehicle.speed,
            0
        );

        const average =
            Math.round(totalSpeed / vehicles.length);

        document.getElementById("avgSpeed")
            .textContent = average;

    }


    // ==========================================
    // FILTER
    // ==========================================

    function filterVehicles(type) {

        activeFilter = type;

        updateMarkers();

    }


    // ==========================================
    // LIVE MOVEMENT
    // ==========================================

    loadVehicles();

    setInterval(
        loadVehicles,
        2000
    );

</script>

</body>
</html>
